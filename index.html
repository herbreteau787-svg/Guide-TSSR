<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guide TSSR + CCNA — Formation Maximale</title>
<meta name="description" content="Fiches, QCM, labos, glossaire et cheat sheets TSSR & CCNA 200-301">
<meta name="theme-color" content="#020617">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuToggle" aria-label="Ouvrir le menu" title="Menu">☰</button>
  <div class="brand">
    <span class="logo">🛠️</span>
    <strong>Guide TSSR + CCNA</strong>
    <small>Édition Maximale</small>
  </div>
  <nav class="tabs" role="tablist" aria-label="Vue principale">
    <button class="tab on" data-tab="cours" role="tab" aria-selected="true">📚 Cours</button>
    <button class="tab" data-tab="qcm" role="tab">📝 QCM</button>
    <button class="tab" data-tab="labos" role="tab">🧪 Labos</button>
    <button class="tab" data-tab="glossaire" role="tab">📖 Glossaire</button>
    <button class="tab" data-tab="cheat" role="tab">🧾 Cheat sheets</button>
    <button class="tab" data-tab="methodes" role="tab">🧭 Méthodes</button>
    <button class="tab" data-tab="progression" role="tab">📊 Progression</button>
    <button class="tab" data-tab="ressources" role="tab">🔗 Ressources</button>
  </nav>
  <div class="top-actions">
    <button class="icon-btn" id="themeToggle" title="Thème clair/sombre">🌗</button>
    <button class="icon-btn" id="exportBtn" title="Exporter la progression">⬇️</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div id="progressBar"><i></i></div>
      <div id="progressText" class="muted small"></div>
    </div>
    <input id="q" class="search" type="search" placeholder="Rechercher commande, concept, tag…">
    <div id="filterRow" class="filter-row">
      <select id="levelFilter" class="select">
        <option value="">Tous niveaux</option>
        <option value="debutant">Débutant</option>
        <option value="intermediaire">Intermédiaire</option>
        <option value="avance">Avancé</option>
        <option value="exam">Examen</option>
      </select>
      <button id="favoritesOnly" class="chip">★ Favoris</button>
    </div>
    <div id="menu"></div>
    <div class="side-foot">
      <p class="muted xsmall">Contenu enrichi, GUI + CLI. Progression locale dans le navigateur.</p>
      <div class="button-row">
        <button id="markAllRead" class="ghost-btn">Tout marquer lu</button>
        <button id="resetProgress" class="ghost-btn danger">Réinitialiser</button>
      </div>
    </div>
  </aside>

  <main id="content" class="main">
    <section class="tab-panel on" data-panel="cours"></section>
    <section class="tab-panel" data-panel="qcm"></section>
    <section class="tab-panel" data-panel="labos"></section>
    <section class="tab-panel" data-panel="glossaire"></section>
    <section class="tab-panel" data-panel="cheat"></section>
    <section class="tab-panel" data-panel="methodes"></section>
    <section class="tab-panel" data-panel="progression"></section>
    <section class="tab-panel" data-panel="ressources"></section>
  </main>
</div>

<template id="toastTemplate">
  <div class="toast"></div>
</template>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
