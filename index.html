<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guide TSSR + CCNA — Fiches GUI/CLI + Examen 40Q</title><style>:root{--bg:#0f172a;--p:#1e293b;--t:#e2e8f0;--m:#94a3b8;--a:#38bdf8;--ok:#4ade80}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--t);display:flex;min-height:100vh}nav{width:290px;background:var(--p);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}nav h1{font-size:1.05rem;color:var(--a);margin:0 0 10px}nav input{width:100%;padding:8px;border-radius:6px;border:1px solid #334155;background:var(--bg);color:var(--t);margin-bottom:10px}nav a{display:block;padding:8px;border-radius:6px;color:var(--t);text-decoration:none;font-size:.88rem;cursor:pointer}nav a:hover,nav a.on{background:#334155}nav a.ex{border:1px solid #22c55e}main{flex:1;padding:24px;max-width:920px}h2{color:var(--a)}.card{background:var(--p);border-radius:10px;padding:16px;margin-bottom:12px;border-left:4px solid var(--a)}.card h3{margin:0 0 6px}.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{background:#334155;color:var(--t);border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:.8rem}.tabs button.on{background:var(--a);color:#04222e;font-weight:700}pre{background:#020617;padding:10px;border-radius:6px;overflow-x:auto}code{color:var(--ok);font-size:.82rem;white-space:pre-wrap}.pts{color:var(--t);font-size:.92rem}.warn{background:#3b2a12;border-left:4px solid #fbbf24;color:#fde68a;padding:8px;border-radius:6px;font-size:.88rem}.q{border:1px solid #334155;border-radius:8px;padding:10px;margin-bottom:8px}.q b{font-size:.92rem}.q label{display:block;font-size:.86rem;margin:4px 0;cursor:pointer}.ok{color:var(--ok)}.ko{color:#f87171}@media(max-width:700px){body{flex-direction:column}nav{width:100%;height:auto;position:static}}</style></head><body><nav><h1>🛠️ Guide TSSR + CCNA</h1><input id="q" placeholder="Rechercher…"><div id="menu"></div><p style="font-size:.7rem;color:var(--m)">Fiches reformulées, inspirées de SpyKeeR/PrepaExamTSSR (GPL-3.0). GUI + CLI maison. CCNA1.pdf dans le repo.</p></nav><main id="content"></main><script>const DATA=[{"id":"ccp1","t":"CCP1 · Support & centre de services","f":[{"t":"Tickets : incident / problème / demande","r":"Incident = service coupé à rétablir vite. Problème = cause racine de plusieurs incidents. Demande = besoin prévu (compte, accès, matériel). Priorité = Impact x Urgence. SLA usuels : P1 4h, P2 8h, P3 24h, P4 72h. N1 accueil, N2 tech, N3 expert.","g":["GLPI : Parc > Tickets > Nouveau : titre clair, catégorie, urgence, impact, utilisateur + poste","Qualifier : message exact, date/heure, reproduction, périmètre (1 ou N users)","Tracer chaque action avec durée, escalader N1>N2>N3 si blocage","Clôture : test avec l'utilisateur + article base de connaissances"],"c":"ipconfig /all\nping 8.8.8.8\nping intranet.local\nnslookup intranet.local\ntracert 8.8.8.8","p":["P1 bloquant, P2 majeur, P3 gêne, P4 confort","Escalader = consigner ce qui a déjà été tenté"],"w":"Reformuler en langage simple, jamais de jargon face à l'utilisateur."},{"t":"Diag réseau poste (entonnoir)","r":"Ordre imposé : 1 physique, 2 IP valide, 3 passerelle, 4 DNS, 5 Internet. 169.254.x.x = APIPA = DHCP KO. Passerelle KO = problème local. DNS KO mais IP OK = résolveur.","g":["Voyant carte + câble, Wi-Fi / mode avion, port de brassage","Paramètres > Réseau > État puis Propriétés : IP, masque, passerelle, DNS","Centre Réseau et partage > Résoudre les problèmes","Tester ping passerelle puis site web + partage réseau"],"c":"ipconfig /all\nping 192.168.1.1\nping 8.8.8.8\nnslookup google.com\nipconfig /release\nipconfig /renew\nipconfig /flushdns\nTest-NetConnection google.com -Port 443","p":["APIPA = DHCP injoignable","ping IP OK + nom KO = DNS"],"w":"Tester par couches, ne jamais conclure trop vite."},{"t":"Compte AD bloqué / MDP oublié","r":"Vérifier identité (badge/manager), ne jamais envoyer un MDP en clair par mail. Forcer changement à la prochaine ouverture. Durée de verrouillage via stratégie.","g":["ADUC (dsa.msc) > Find > utilisateur > Clic droit > Reset Password + Unlock","Cocher User must change password at next logon","Vérifier Member Of + compte expiré ?","Informer par canal séparé + code temporaire"],"c":"Unlock-ADAccount -Identity jdupont\nSet-ADAccountPassword -Identity jdupont -Reset -NewPassword (ConvertTo-SecureString 'Temp2026!' -AsPlainText -Force)\nSet-ADUser -Identity jdupont -ChangePasswordAtLogon $true","p":["Lockout = seuil GPO, déblocage manuel ou attente","Historique via Event Viewer > Security 4740"],"w":"Double vérification d'identité obligatoire."}]},{"id":"ccp2","t":"CCP2 · Windows Server & AD","f":[{"t":"AD DS : forêt, domaine, OU, FSMO","r":"Forêt > domaine > OU. 5 rôles FSMO : Schema + Domain Naming (forêt), PDC, RID, Infrastructure (domaine). PDC = temps + MDP. GC pour ouverture multi-domaines.","g":["Server Manager > Add Roles > AD DS > Promouvoir en contrôleur","ADUC : créer OU par site/service, délégation de contrôle","Sites and Services : configurer réplication inter-sites","Sauvegarder état système du DC"],"c":"Install-WindowsFeature AD-Domain-Services -IncludeManagementTools\nInstall-ADDSForest -DomainName lan.local\nnetdom query fsmo\nrepadmin /replsummary\ndcdiag /v","p":["2 DC minimum en prod","PDC = source temps NTP"],"w":"Ne jamais restaurer un DC par snapshot sans procédure."},{"t":"AGDLP + GPO en pratique","r":"AGDLP : comptes dans Global, Global dans Local-Domaine, droits sur ressource. GPO : Computer = démarrage, User = ouverture. Ordre LSDOU, Enforced + Block gagnent.","g":["ADUC : créer GG_Service, DL_Partage_RW, appliquer NTFS + partage","GPMC (gpmc.msc) : lier GPO à l'OU, filtrage sécurité","Tester sur OU pilote avant généralisation","gpresult /r côté poste pour valider"],"c":"New-ADGroup 'GG_Compta' -GroupScope Global\nAdd-ADGroupMember GG_Compta -Members jdupont\ngpupdate /force\ngpresult /r /scope computer","p":["Global>DL>ressource : règle d'examen","GPO mapping lecteur, fond, verrouillage"],"w":"Une GPO mal liée = panne collective."},{"t":"DNS & DHCP Windows","r":"DNS AD = zones intégrées + dynamique sécurisée. Enregistrements A, PTR, CNAME, MX, SRV (AD). DHCP : étendue, bail, réservation MAC, options 003/006/015, bascule 80/20 ou failover.","g":["DNS Manager : zone directe lan.local + inverse, scavenging","DHCP : New Scope, plage, exclusions, réservations imprimantes","Options : 003 passerelle, 006 DNS, 015 suffixe","Sauvegarder base DHCP + auditer baux"],"c":"Add-DnsServerPrimaryZone -Name lan.local -ReplicationScope Forest\nAdd-DhcpServerv4Scope -Name LAN -StartRange 192.168.1.100 -EndRange 192.168.1.200 -SubnetMask 255.255.255.0\nGet-DhcpServerv4Lease -ScopeId 192.168.1.0\nipconfig /registerdns","p":["PTR inverse = messagerie/antispam","Réservation = IP fixe gérée DHCP"],"w":"Toujours exclure IP fixes de l'étendue."},{"t":"NTFS vs Partage + jonction domaine","r":"Accès final = le plus restrictif entre NTFS et Partage. Partage : Everyone Lecture par défaut à durcir. Ordre : partage puis NTFS fin. Jonction = objet computer + DNS + compte autorisé.","g":["Dossier > Partager > Autorisations + Sécurité NTFS (héritage)","Paramètres > Système > Domaine : lan.local, redémarrer","Vérifier avec session test (lecture/écriture)","Documenter droits par groupe DL"],"c":"New-SmbShare -Name Docs -Path D:\\Docs -FullAccess 'LAN\\DL_Docs_RW'\nicacls D:\\Docs /grant 'LAN\\DL_Docs_RW:(OI)(CI)M'\nTest-ComputerSecureChannel\nAdd-Computer -DomainName lan.local -Restart","p":["Refus explicite > tout","Héritage à couper avec copie"],"w":"Everyone Full = faute éliminatoire."}]},{"id":"ccp3","t":"CCP3 · Linux","f":[{"t":"Fichiers, droits, paquets, systemd","r":"/etc configs, /var logs, /home users. Droits rwx (4-2-1) : chmod 640 fichier, 750 dossier. sudoers via visudo. APT : update/upgrade/install/remove. systemd : systemctl enable/start/status + journalctl.","g":["Ubuntu Server : installateur > LVM + OpenSSH coché","Paramètres > Utilisateurs pour poste desktop ; sinon GNOME Settings","Disques (gnome-disks) pour monter / formater en GUI","Log Viewer pour /var/log/syslog"],"c":"ls -la\nchmod 640 app.conf\nchown app:app app.conf\napt update && apt upgrade -y\nsystemctl enable --now ssh\njournalctl -u ssh -f\nuseradd -m -s /bin/bash lea\npasswd lea\nusermod -aG sudo lea\ntar -czf save.tgz /etc/nginx","p":["Ne jamais chmod 777","visudo obligatoire","tester config avant restart"],"w":"Mot de passe root direct en SSH = éliminatoire."},{"t":"Réseau Linux, SSH, cron, dépannage","r":"Netplan /etc/netplan/*.yaml puis netplan apply. resolv.conf via systemd-resolved. SSH : clés ed25519 + PasswordAuthentication no. Cron : m h dom mon dow. Logs : journalctl, /var/log/auth.log, dmesg.","g":["Cockpit http://srv:9090 : réseau, services, terminal web","VS Code Remote-SSH pour éditer /etc/netplan en GUI","Crontab GUI gnome-schedule si desktop"],"c":"ip a\nip r\ncat /etc/netplan/50-cloud-init.yaml\nsudo netplan apply\nresolvectl status\nssh-keygen -t ed25519\nssh-copy-id admin@srv\nsudo systemctl restart ssh\ncrontab -e\n30 2 * * * /opt/backup.sh\nping 8.8.8.8\nss -tulpn\ndf -h\nfree -h","p":["IP plan : IP/masque/passerelle/DNS","toujours garder 1 session avant restart SSH"],"w":"netplan apply sans vérif = perte réseau."}]},{"id":"ccp4","t":"CCP4 · Réseau & Cisco IOS","f":[{"t":"Ports, modèles, matériel","r":"Web 80/443, DNS 53, DHCP 67/68, SSH 22, FTP 21, SMB 445, RDP 3389, SMTP 25/587, IMAP 143/993, SNMP 161/162, LDAP 389/636, Kerberos 88, NTP 123, Syslog 514. Commutateur = L2, routeur = L3, AP Wi-Fi.","g":["Packet Tracer : glisser switch/routeur/PC > onglet Config","Wireshark : capture > filtre tcp.port==80 pour voir HTTP","Fing / Advanced IP Scanner pour inventaire"],"c":"ping 8.8.8.8\ntracert 8.8.8.8\nnslookup google.com\nTest-NetConnection srv -Port 443","p":["TCP fiable, UDP rapide","Bien/Connu 0-1023"],"w":"Confondre TCP/UDP sur QCM = piège classique."},{"t":"Subnetting + VLAN + routage","r":"/24 = 254 hôtes, /25 = 126, /26 = 62, /27 = 30, /28 = 14, /30 = 2 (liaisons). Formule : 2^(32-masque)-2. VLAN = broadcast domain L2. Trunk 802.1Q transporte plusieurs VLAN. Routage inter-VLAN via sous-interfaces ou SVI. OSPF area 0.","g":["Packet Tracer > switch > Config > VLAN Database > créer 10/20","Affecter ports access, trunk sur lien inter-switch","Routeur : Config > sous-interfaces + encapsulation dot1Q"],"c":"enable\nconf t\nvlan 10\nname USERS\nexit\nint range f0/1-10\nswitchport mode access\nswitchport access vlan 10\nexit\nint g0/1\nswitchport mode trunk\nrouter ospf 1\nnetwork 192.168.0.0 0.0.255.255 area 0\nshow ip route\nshow vlan brief\nshow int trunk","p":["Natif VLAN 1 à changer","toujours show avant write"],"w":"Oublier le trunk = VLAN isolés."}]},{"id":"virt","t":"Virtualisation VMware","f":[{"t":"vSphere, vMotion, HA, DRS, snapshots","r":"ESXi = hyperviseur bare-metal. vCenter centralise. vMotion = VM à chaud, Storage vMotion = disque à chaud. HA redémarre en cas de panne, DRS équilibre la charge. Snapshot = delta, pas une sauvegarde.","g":["vSphere Client : Hôtes > Nouveau Datacenter > Ajouter hôte","Créer VM : ISO, CPU/RAM, VMXNET3 + PVSCSI","Snapshot : Clic VM > Snapshots > Take (nom + date)","vMotion : Migrer > Compute + Storage"],"c":"esxcli system version get\nesxcli network vswitch standard list\nvim-cmd vmsvc/getallvms","p":["VMware Tools obligatoires","1 snapshot court, jamais en prod longue"],"w":"Snapshot oublié = datastore plein."}]},{"id":"ccp6","t":"CCP6 · Scripts & automatisation","f":[{"t":"Bash robuste + PowerShell + planification","r":"Bash : shebang, set -euo pipefail, test args $# et [ -f/-d ], guillemets \"$var\", code retour $?. PowerShell : pipeline objet, try/catch avec -ErrorAction Stop, ExecutionPolicy RemoteSigned. Planif : cron Linux, schtasks Windows.","g":["VS Code + extension PowerShell/Bash : debug pas-à-pas","Planificateur Windows : Créer tâche > déclencheur quotidien 2h30 > .ps1","GNOME Schedule pour cron en GUI"],"c":"#!/bin/bash\nset -euo pipefail\nif [ $# -ne 1 ]; then echo \"Usage: $0 dossier\"; exit 1; fi\nDEST=\"/srv/sav/$(date +%F)\"\nmkdir -p \"$DEST\"\ncp -a \"$1\" \"$DEST/\"\necho OK\n\n# PowerShell :\ntry {\n Get-Content C:\\absent.txt -ErrorAction Stop\n} catch {\n Write-Warning \"Erreur : $($_.Exception.Message)\"\n}\n# cron 2h30 :\n30 2 * * * /opt/backup.sh\n# Windows :\nschtasks /create /tn Sauvegarde /tr \"C:\\Scripts\\backup.cmd\" /sc daily /st 02:30","p":["Tester à la main avant planifier","Chemins absolus en planifié","Journaliser sorties"],"w":"rm -rf $var non quoté = catastrophe."},{"t":"Supervision + inventaire (bonus exam)","r":"Supervision : SNMP, agent, seuils CPU/RAM/disque, alertes mail. Inventaire GLPI + FusionInventory. Centreon/Zabbix : hôtes, services, traps. Documenter MIB et communautés SNMP v3.","g":["Centreon/Zabbix web : ajouter hôte > SNMP > templates Linux/Windows","GLPI : Parc > Inventaire automatique"],"c":"snmpwalk -v2c -c public srv system\nsystemctl status centreon* \nGet-EventLog System -Newest 20","p":["SNMP v3 auth/priv en prod"],"w":"SNMP public en écriture = fail."}]},{"id":"ccp7","t":"CCP7 · Sécurisation Internet (pfSense)","f":[{"t":"Pare-feu, NAT, VPN, proxy + DMZ","r":"pfSense : règles évaluées de haut en bas par interface, 1ère match gagne, deny implicite. WAN deny all par défaut, LAN allow all à restreindre. NAT/PAT pour sortie, port-forward entrant. VPN IPsec site-à-site, OpenVPN nomade. Squid proxy + filtrage. DMZ : 3 pattes LAN/DMZ/WAN.","g":["pfSense web : Firewall > Rules > LAN/WAN : allow LAN net any sauf RFC1918 en DMZ","NAT > Port Forward : WAN 443 > srv DMZ","VPN > OpenVPN Wizards, IPsec Tunnels","Squid : Services > Proxy + ACL catégories"],"c":"pfctl -sr\ntcpdump -i em0 port 443\ntraceroute 1.1.1.1\n# iptables exemple DMZ :\niptables -A FORWARD -i lan -o dmz -p tcp --dport 443 -j ACCEPT\niptables -A FORWARD -i dmz -o lan -m state --state ESTABLISHED,RELATED -j ACCEPT\niptables -P FORWARD DROP","p":["Logguer règles deny","Sauvegarder config XML"],"w":"Any-any WAN = éliminatoire."}]},{"id":"ccp8","t":"CCP8 · Sauvegardes & PRA/PCA","f":[{"t":"3-2-1, RPO/RTO, tests de restauration","r":"Complète + incrémentielle (depuis dernière) + différentielle (depuis complète). 3 copies, 2 supports, 1 hors site. RPO = perte max acceptée, RTO = durée max d'arrêt. Tester restauration 2x/an, chiffrer et journaliser.","g":["Veeam/UrBackup web : Job > Full hebdo + Incr quotidienne, test restore VM isolée","NAS : snapshots + réplication offsite"],"c":"tar -czf /srv/sav/full-$(date +%F).tgz /etc /home\nrsync -a --delete /data/ /mnt/nas/\nrestic check\nsha256sum save.tgz","p":["Sauvegarder AD + DNS/DHCP + conf réseau","Étiqueter supports"],"w":"Sauvegarde jamais testée = pas de sauvegarde."}]},{"id":"ccp9","t":"CCP9 · Déploiement + ToIP + Intranet/DMZ","f":[{"t":"MDT/WDS, sysprep, ToIP Asterisk, Apache intranet","r":"Chaîne : image ref + sysprep + capture WDS/MDT + PXE/DHCP opt 66/67 + GPO post-install. ToIP : SIP 5060/5061, RTP 10000-20000, VLAN voix, QoS DSCP EF, PoE. Apache intranet : vhost + allow LAN only. DMZ : flux LAN>DMZ limités, DMZ>LAN refusés.","g":["MDT : DeploymentShare > Task Sequence > Capture ; WDS : image boot.wim PXE","FreePBX web : Extensions > Trunks > Routes ; test appel","Apache : conf vhost + firewall GUI"],"c":"wdsutil /get-image /imagename:Win11\nsysprep /oobe /generalize /shutdown\nasterisk -rvvv\nsip show peers\npjsip show endpoints\n# Apache LAN only :\n<Directory /var/www/intranet>\n Require ip 192.168.1.0/24\n</Directory>\nsystemctl reload apache2","p":["Tester PXE en VLAN dédié","Sauvegarder conf IPBX"],"w":"VLAN voix sans QoS = coupures."}]},{"id":"ccna1","t":"🌐 CCNA 1 · Fondamentaux (OSI, IP, subnetting)","f":[{"t":"OSI/TCP-IP + câblage + IPv4/IPv6 + PDF","r":"OSI 7 couches : Physique/Liaison/Réseau/Transport/Session/Présentation/Application. TCP fiable (3-way handshake, ACK), UDP rapide (voix/vidéo). Câbles : droit même équipement différent niveau, croisé même niveau (Auto-MDIX moderne). IPv4 32 bits, classes + privé 10/8, 172.16/12, 192.168/16. IPv6 128 bits, link-local fe80::/10. Ton CCNA1.pdf = cours complet à garder à côté.","g":["Packet Tracer : placer 2 PC + switch + routeur, mode Simulation pour voir OSI","Wireshark : capture handshake TCP + ping pour couches"],"c":"show ip interface brief\nping 8.8.8.8\ntracert 8.8.8.8 (Win) / traceroute (Cisco)\nipcalc 192.168.1.0/24\n# Subnet rapide : /24=256, /25=128, /26=64, /27=32, /28=16, /30=4 (liaisons)","p":["APIPA 169.254 = DHCP KO","/30 pour point-à-point"],"w":"Confondre masque et wildcard = 0 en exam."},{"t":"Subnetting méthode exam (détaillée)","r":"Formules : nb hôtes = 2^(32-masque)-2. /24 : 254 hôtes. Découpe : emprunter n bits = 2^n sous-réseaux. Ex : 192.168.1.0/24 en /26 = 4 sous-réseaux de 62 hôtes (.0, .64, .128, .192). VLSM : donner au plus gros besoin d'abord.","g":["ipcalc / SolarWinds Subnet Calculator pour vérifier","Packet Tracer : adresser 3 LAN de tailles différentes"],"c":"# Ex VLSM : 192.168.10.0/24, besoins 100+50+10\n# 100 -> /25 (.0-.127)\n# 50 -> /26 (.128-.191)\n# 10 -> /28 (.192-.207)\nshow ip route","p":["Toujours réserver réseau + broadcast","VLSM du plus gros au plus petit"],"w":"Oublier -2 = erreur classique."}]},{"id":"ccna2","t":"🌐 CCNA 2 · Commutation & routage (VLAN, STP, OSPF)","f":[{"t":"VLAN, trunk 802.1Q, DTP, STP, EtherChannel","r":"VLAN = broadcast domains. Accès = 1 VLAN, trunk = multiples (natif non taggé). DTP auto/desirable à bannir -> trunk statique. STP : bloque boucles, Root Bridge + états. EtherChannel LACP : agrégation 2-8 liens.","g":["Packet Tracer : 2 switches, créer VLAN 10/20, trunk entre eux","show spanning-tree pour voir Root"],"c":"vlan 10\n name USERS\ninterface range f0/1-10\n switchport mode access\n switchport access vlan 10\ninterface g0/1\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan 10,20\nspanning-tree vlan 10 root primary\nchannel-group 1 mode active","p":["VLAN 1 natif à changer","Trunk statique en exam"],"w":"DTP auto = faille + instable."},{"t":"Routage inter-VLAN, OSPFv2, DHCP, FHRP","r":"Router-on-a-stick (sous-interfaces .10/.20) ou SVI L3. OSPF : backbone area 0, Router-ID, hello 10s, DR/BDR. DHCP : pool + excluded. FHRP : HSRP/VRRP pour passerelle redondante.","g":["Packet Tracer : routeur + 2 VLAN, ping inter-VLAN","show ip ospf neighbor pour adjacence"],"c":"interface g0/0.10\n encapsulation dot1Q 10\n ip address 192.168.10.1 255.255.255.0\nrouter ospf 1\n router-id 1.1.1.1\n network 192.168.10.0 0.0.0.255 area 0\n passive-interface default\n no passive-interface g0/0\nip dhcp pool LAN\n network 192.168.10.0 /24\n default-router 192.168.10.1\nshow ip route ospf","p":["Area 0 obligatoire","Passive sur LAN"],"w":"Mauvais wildcard = voisin DOWN."}]},{"id":"ccna3","t":"🌐 CCNA 3 · Services, sécu, automation + PDF","f":[{"t":"NAT/PAT, NTP/DNS, ACL, SSH, VPN/IPsec, QoS, SDN","r":"NAT statique 1-1, PAT overload N-1. ACL : standard (source) près destination, étendue (proto/port) près source, sens in/out. SSH : hostname+domaine+clé. VPN IPsec site-à-site. QoS : voix EF prioritaire. SDN : contrôleur + REST, JSON, Python netmiko.","g":["Packet Tracer : NAT overload + ACL test ping/telnet","Postman pour tester API REST DNAC"],"c":"access-list 100 permit tcp 192.168.10.0 0.0.0.255 any eq 443\naccess-list 100 deny ip any any log\ninterface g0/0\n ip access-group 100 in\nip nat inside source list 1 interface g0/1 overload\nhostname R1\nip domain-name lan.local\ncrypto key generate rsa modulus 2048\nip ssh version 2\nntp server 1.fr.pool.ntp.org","p":["ACL : une seule par sens/interface","Log en fin d'ACL"],"w":"ACL inversée = tout bloqué."},{"t":"Lien CCNA1.pdf + méthode révision CCNA","r":"Ton fichier CCNA1.pdf (15 Mo) dans le repo = référence. Le relire après chaque lab Packet Tracer. Fiches exam : ports, tables subnetting, commandes show.","g":["GitHub : ouvrir CCNA1.pdf via View Raw pour révision","Packet Tracer : refaire chaque lab 2x sans aide"],"c":"show running-config\nshow ip int brief\nshow vlan brief\nshow ip route\nshow ip ospf neighbor\nshow access-lists\nshow ip nat translations","p":["Apprendre show par coeur","Labs > théorie"],"w":"Lire sans pratiquer = échec assuré."}]}];const QCM=[{"q":"Un utilisateur a 169.254.10.5 en ipconfig. Que conclure ?","c":["IP publique valide","Échec DHCP, adresse APIPA auto-attribuée","Conflit DNS","VPN actif"],"a":1,"e":"169.254/16 = APIPA : aucun serveur DHCP joignable. Vérifier service DHCP, câble, VLAN."},{"q":"Ordre correct du diagnostic réseau poste ?","c":["DNS > IP > câble > Internet","Physique > IP > passerelle > DNS > Internet","Internet > DNS > IP > câble","Passerelle > WiFi > DNS > IP"],"a":1,"e":"Méthode entonnoir : physique, IP valide, ping passerelle, nslookup, ping 8.8.8.8."},{"q":"Différence incident / problème (ITIL) ?","c":["Aucune","Incident = coupure à rétablir vite ; problème = cause racine","Problème = plus urgent","Incident = demande planifiée"],"a":1,"e":"Incident on rétablit, problème on cherche la cause pour éviter récidive."},{"q":"PowerShell : créer 100 users depuis CSV ?","c":["Import-Csv + New-ADUser en boucle","copy users.csv vers AD","ping + ipconfig","Get-Process"],"a":0,"e":"Import-Csv users.csv | ForEach { New-ADUser ... }."},{"q":"Combien de rôles FSMO et maître de schéma ?","c":["3, un seul global","5, un seul maître de schéma par forêt","7, un par DC","1 unique"],"a":1,"e":"5 rôles : schéma, nommage, RID, PDC, infrastructure. Schéma = unique par forêt."},{"q":"Bonne pratique AGDLP ?","c":["Mettre users directs dans ACL","Users > Global > Domain Local > Permissions","Everyone Full sur partage","Désactiver héritage partout"],"a":1,"e":"A G DL P : comptes dans Globaux, Globaux dans Locaux de Domaine, droits sur Locaux."},{"q":"Port LDAPS et Kerberos ?","c":["389 + 88","636 + 88","443 + 389","636 + 445"],"a":1,"e":"LDAP 389, LDAPS 636, Kerberos 88, SMB 445, DNS 53."},{"q":"DH tById('q');let cur=DATA[0].id;function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}function renderMenu(f=''){M.innerHTML='';DATA.forEach(s=>{if(f&&!(s.t+s.f.map(x=>x.t+x.r).join(' ')).toLowerCase().includes(f.toLowerCase()))return;const a=document.createElement('a');a.textContent=s.t;a.className=s.id==='exam'?'ex':'';if(s.id===cur)a.classList.add('on');a.onclick=()=>{cur=s.id;renderMenu(Ql.value);render()};M.appendChild(a)});}function card(h,idx,sec){const d=document.createElement('div');d.className='card';const ck=localStorage.getItem('tssr-'+sec+'-'+idx)?'checked':'';d.innerHTML='<h3><input type=checkbox '+ck+' data-k=\'tssr-'+sec+'-'+idx+'\' style=\'margin-right:8px\'>'+esc(h.t)+'</h3><p style=\'color:var(--m)\'>'+esc(h.r)+'</p>'+(h.p?'<ul class=pts>'+h.p.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>':'')+(h.w?'<div class=warn>⚠️ '+esc(h.w)+'</div>':'')+'<div class=tabs><button class=on>⌨️ CLI</button><button>🖱️ GUI</button></div><div class=cli><pre><code>'+esc(h.c||'Voir GUI')+'</code></pre><button class=cp2>Copier CLI</button></div><div class=gui style=display:none><ol class=pts>'+(h.g||[]).map(g=>'<li>'+esc(g)+'</li>').join('')+'</ol></div>';d.querySelectorAll('.tabs button').forEach((b,i)=>b.onclick=()=>{d.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');d.querySelector('.cli').style.display=i===0?'block':'none';d.querySelector('.gui').style.display=i===1?'block':'none'});const cp=d.querySelector('.cp2');if(cp)cp.onclick=()=>{navigator.clipboard.writeText(h.c||'');cp.textContent='Copié ✓';setTimeout(()=>cp.textContent='Copier CLI',1200)};const chk=d.querySelector('input[type=checkbox]');chk.onchange=()=>{if(chk.checked)localStorage.setItem(chk.dataset.k,'1');else localStorage.removeItem(chk.dataset.k)};return d}function render(){const s=DATA.find(x=>x.id===cur);C.innerHTML='<h2>'+esc(s.t)+'</h2>';if(s.id==='exam'){renderExam();return}s.f.forEach((h,i)=>C.appendChild(card(h,i,s.id)))}let T=null,sec=0;function renderExam(){C.innerHTML='<h2>📝 Examen blanc — 40 questions TSSR + CCNA</h2><p style=color:var(--m)>40 questions · 60 min · 12/20 pour valider. Timer + corrigé détaillé.</p><div style=display:flex;gap:8px;margin-bottom:12px><button id=stex style=background:#22c55e;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer>Démarrer (60:00)</button><button id=crex style=background:#334155;color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer>Corriger</button><span id=timer style=align-self:center;color:var(--a);font-weight:700></span><span id=score style=align-self:center></span></div><div id=ql></div>';const ql=document.getElementById('ql');QCM.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<b>Q'+(i+1)+'. '+esc(q.q)+'</b>'+q.c.map((c,j)=>'<label><input type=radio name=q'+i+' value='+j+'> '+esc(c)+'</label>').join('')+'<div class=exp style=display:none;color:var(--m);font-size:.85rem>💡 '+esc(q.e)+'</div>';ql.appendChild(d)});document.getElementById('stex').onclick=()=>{sec=3600;clearInterval(T);T=setInterval(()=>{sec--;const m=Math.floor(sec/60),s=sec%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(sec<=0){clearInterval(T);corriger()}},1000)};document.getElementById('crex').onclick=corriger}function corriger(){clearInterval(T);let n=0;QCM.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const divs=document.querySelectorAll('#ql .q');const dv=divs[i];dv.querySelector('.exp').style.display='block';const labs=dv.querySelectorAll('label');labs.forEach((l,j)=>{if(j===q.a)l.classList.add('ok');if(r&&+r.value===j&&j!==q.a)l.classList.add('ko')});if(r&&+r.value===q.a)n++});document.getElementById('score').textContent=n+'/40 '+(n>=24?'✅ Admis':'❌ Recalé (<24)')}Ql.oninput=()=>renderMenu(Ql.value);renderMenu();render();</script></body></html>
