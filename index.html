🌙 Mode Clair / Sombre
</button><div id=bar><i></i></div><div id=menu></div><p style="font-size:.7rem;color:#64748b">Fiches de revision originales pour la certification TSSR et CCNA 200-301.</p></nav><main id=content></main><script>const DATA=[{"id":"ccp1","t":"CCP1 Support & centre de services","f":[{"t":"Tickets incident/probleme/demande + SLA","r":"Incident = service coupe a retablir vite. Probleme = cause racine de plusieurs incidents. Demande = besoin prevu. Priorite = Impact x Urgence. SLA : P1 4h, P2 8h, P3 24h, P4 72h. N1 accueil, N2 tech, N3 expert. Tout est trace dans le ticket.","g":["GLPI > Tickets > Nouveau : titre [LIEU][POSTE] + categorie + urgence","Renseigner demandeur, description exacte, capture ecran","Attribuer N1/N2, suivi a chaque test","Faire valider par user puis cloturer"],"c":"ipconfig /all\nping 8.8.8.8\nnslookup srv.lan","p":["Message exact + photo","Escalader si hors perimetre"],"w":"Ne jamais cloturer sans validation."},{"t":"Diag reseau entonnoir","r":"Physique (cable, voyant, wifi) > IP (169.254 = DHCP KO) > passerelle (ping gateway) > DNS (nslookup) > Internet (ping 8.8.8.8). Noter chaque resultat.","g":["Voyant RJ45 + icone reseau","Parametres > Reseau : profil Prive","Centre reseau : IP, masque, passerelle, DNS"],"c":"ipconfig /all\nping 192.168.1.1\nping 8.8.8.8\nnslookup google.com\nipconfig /renew\nipconfig /flushdns","p":["APIPA = DHCP KO","IP OK + nom KO = DNS"],"w":"Tester passerelle avant DNS."},{"t":"Compte AD : MDP + debloquage","r":"Verifier identite (badge + manager) avant reset. Forcer changement prochaine ouverture. Debloquer + verifier verrouillage.","g":["ADUC dsa.msc > Users > clic droit","Reset MDP + cocher changer prochaine fois","Onglet Compte : deverrouiller"],"c":"Set-ADAccountPassword -Identity jdupont -Reset -NewPassword (ConvertTo-SecureString 'Temp2026!' -AsPlainText -Force)\nSet-ADUser -Identity jdupont -ChangePasswordAtLogon $true\nUnlock-ADAccount -Identity jdupont","p":["Canal separe pour MDP"],"w":"Pas de MDP en clair par mail."}]},{"id":"ccp2","t":"CCP2 Windows Server & AD","f":[{"t":"Installer AD DS + DNS","r":"Un DC = ADDS + DNS + horloge sync. Prevoir 2 DC mini. Foret ex tssr.lan, MDP DSRM, niveau fonctionnel.","g":["Gestionnaire serveur > Ajouter roles AD DS + DNS","Promouvoir : nouvelle foret tssr.lan","Verifier DNS + Sites et services"],"c":"Install-WindowsFeature AD-Domain-Services -IncludeManagementTools\nInstall-ADDSForest -DomainName tssr.lan -InstallDns\ndcdiag /q","p":["PDC = source temps NTP"],"w":"Jamais un seul DC."},{"t":"FSMO 5 roles","r":"Foret : Schema + Noms de domaine (uniques). Domaine : RID, PDC, Infrastructure. PDC = temps + MDP prio.","g":["ADUC > Operations Masters pour RID/PDC/Infra","Schema via regsvr32 schmmgmt"],"c":"netdom query fsmo\nMove-ADDirectoryServerOperationMasterRole -Identity DC2 -OperationMasterRole PDCEmulator -Force","p":["Noter quel DC a quel role"],"w":"Couper PDC = horloge derive."},{"t":"AGDLP + GPO + partages","r":"Users > Global > DL > ACL. GPO : Ordinateurs ou Users, liee a OU, gpupdate /force, gpresult /r. Partage large + NTFS fin, le plus restrictif gagne.","g":["ADUC : creer G, DL, mettre G dans DL","GPMC : lier GPO a OU, filtrer","Partage : Everyone Lecture + NTFS DL RW"],"c":"New-ADGroup -Name G_Compta -GroupScope Global\nNew-SmbShare -Name Docs -Path D:\\Docs\nicacls D:\\Docs /grant 'TSSR\\DL_Docs_RW:(OI)(CI)M'\ngpupdate /force","p":["Refus explicite > tout"],"w":"Everyone Controle total = eliminatoire."}]},{"id":"ccp3","t":"CCP3 Linux","f":[{"t":"Bases /etc APT nano","r":"/etc configs, /var logs, /home users. Fichiers : passwd, shadow, fstab, hosts, sshd_config. nano simple, vim 3 modes. apt update/upgrade/install/remove.","g":["Ubuntu : cocher OpenSSH","Logiciels Ubuntu en GUI","gedit pour /etc"],"c":"apt update && apt upgrade -y\napt install -y nginx htop\nls -la /etc","p":["update avant install"],"w":"Editer /etc sans sauvegarde."},{"t":"Droits users systemd reseau cron","r":"chmod 640 fichier, 750 dossier/script. chown user:group. visudo pour sudo. systemctl enable/start/status + journalctl. Netplan apply. SSH cles + no password. Cron m h dom mon dow.","g":["Cockpit :9090 reseau/services","gnome-schedule pour cron GUI"],"c":"chmod 640 app.conf\nuseradd -m lea\nsystemctl enable --now ssh\nip a\n30 2 * * * /opt/backup.sh","p":["Jamais 777","Chemins absolus en cron"],"w":"Root SSH direct."}]},{"id":"ccp4","t":"CCP4 Reseau & Cisco","f":[{"t":"Ports a connaitre","r":"22 SSH, 23 Telnet (banni), 53 DNS, 67/68 DHCP, 80 HTTP, 443 HTTPS, 21 FTP, 25/587 SMTP, 110/143/993 mail, 389/636 LDAP, 445 SMB, 3306 MySQL, 5060 SIP, 3389 RDP, 161 SNMP, 123 NTP.","g":["Wireshark : filtrer tcp.port==443","Nmap GUI Zenmap scan"],"c":"Test-NetConnection srv -Port 443\nnslookup google.com\nss -tulpn","p":["TCP fiable vs UDP rapide"],"w":"Telnet en clair."},{"t":"Subnetting + IOS","r":"Hotes=2^(32-m)-2. /24 254, /26 62, /27 30, /30 2 liaisons. 192.168.1.0/24 en /26 = 4x62. VLSM : gros besoin d'abord. IOS : enable, conf t, no shutdown, copy run start.","g":["ipcalc pour verifier","Packet Tracer 3 LAN"],"c":"enable\nconf t\nhostname SW1\nvlan 10\ninterface fa0/1\nswitchport mode access\nswitchport access vlan 10\nno shutdown\nshow vlan brief","p":["Ne pas oublier no shutdown"],"w":"Port reste VLAN1."}]},{"id":"ccp5","t":"CCP5 Virtualisation","f":[{"t":"vSphere ESXi vCenter HA vMotion","r":"ESXi hyperviseur, vCenter centralise, cluster HA (redemarre VM si hote mort) + DRS (equilibre charge). Stockage local/NFS/iSCSI/vSAN. vSwitch + VMkernel. Tools dans chaque VM.","g":["vSphere Client : creer VM ISO, VMXNET3","Snapshot Take avec date"],"c":"esxcli system version get\nvim-cmd vmsvc/getallvms","p":["Tools a jour"],"w":"Snapshot = delta, pas sauvegarde."},{"t":"Snapshots et bonnes pratiques","r":"Snapshot fige delta, utile avant maj/test. 1 seul, court, supprimer apres. Sinon datastore plein et perfs chute. Sauvegarde = Veeam, pas snapshot.","g":["Delete + Consolidate apres test"],"c":"df -h","p":["Nommer + dater"],"w":"Snapshot oublie en prod."}]},{"id":"ccp6","t":"CCP6 Scripts","f":[{"t":"Bash + PowerShell + planif","r":"Bash : shebang, set -euo pipefail, test $#, guillemets. PowerShell : pipeline objet, try/catch -ErrorAction Stop. Cron Linux, schtasks Windows.","g":["VS Code debug","Planificateur Windows tache 2h30"],"c":"#!/bin/bash\nset -euo pipefail\ncp -a \"$1\" /srv/sav/\n# PS:\ntry{Get-Content C:\\f.txt -ErrorAction Stop}catch{Write-Warning $_}\n30 2 * * * /opt/backup.sh","p":["Tester avant planifier"],"w":"rm -rf var non quote."}]},{"id":"ccp7","t":"CCP7 Secu pfSense DMZ","f":[{"t":"pfSense NAT VPN proxy","r":"Stateful : premiere regle gagne. WAN bloque, LAN ouvert a restreindre + Deny all fin. NAT/PAT sortie, IPsec site-a-site, OpenVPN nomade, Squid filtrage.","g":["Aliases > Rules LAN > NAT > VPN Wizard"],"c":"ping 8.8.8.8\npfctl -sr | head","p":["Deny all fin"],"w":"Any-Any = faute."},{"t":"DMZ + Apache","r":"DMZ tampon : WAN>DMZ 80/443 OK, DMZ>LAN interdit. Apache VirtualHost + Require ip LAN.","g":["OPT1 DMZ 10.0.0.1/24","a2ensite intranet"],"c":"a2ensite intranet\nsystemctl reload apache2","p":["Logs separes"],"w":"DMZ vers LAN = plus de DMZ."}]},{"id":"ccp8","t":"CCP8 Sauvegardes PRA PCA","f":[{"t":"3-2-1 RPO RTO","r":"3 copies 2 supports 1 hors site. Complete/incrementielle/differentielle. RPO perte max, RTO duree max arret. PRA remonter, PCA continuer. Tester restore.","g":["Veeam job quotidien + hebdo complete","Test restore 1 fichier + 1 VM"],"c":"rsync -a --delete /srv/ /mnt/sav/\ntar -czf /mnt/sav/etc-$(date +%F).tgz /etc","p":["Alerte si rouge"],"w":"Meme disque = zero protection."}]},{"id":"ccp9","t":"CCP9 Deploiement ToIP","f":[{"t":"Image Sysprep WDS PXE","r":"Ref en VM, Sysprep generalize oobe, capture WIM, PXE WDS/MDT. DHCP 66/67. Tester 1 poste avant vague.","g":["WDS Capture + Install","F12 PXE"],"c":"sysprep /oobe /generalize /shutdown","p":["VLAN dedie"],"w":"Sans Sysprep = SID dupliques."},{"t":"ToIP Asterisk QoS","r":"SIP 5060 RTP 10000-20000. Dialplan, VLAN voix + QoS EF. FreePBX web.","g":["FreePBX Extensions Trunks"],"c":"asterisk -rvvv\npjsip show endpoints","p":["Separer voix/data"],"w":"Sans QoS voix hachee."}]},{"id":"ccna","t":"CCNA 200-301","f":[{"t":"Fondamentaux + subnetting","r":"OSI 7, TCP handshake, UDP. Prive 10/8 172.16/12 192.168/16. IPv6 fe80::/10. /26=62 /27=30 /30=2. VLSM gros d'abord. CCNA1.pdf en complement.","g":["Packet Tracer Simulation","Wireshark"],"c":"show ip int brief\nping 8.8.8.8\n# /26 bloc 64 : .0 .64 .128 .192","p":["APIPA=DHCP KO"],"w":"Masque vs wildcard."},{"t":"VLAN trunk OSPF NAT ACL","r":"Access 1 VLAN, trunk 802.1Q plusieurs. STP anti-boucle. OSPF area, DR/BDR, FULL. NAT PAT, ACL etendue, DHCP snooping, SSH, copy run start.","g":["Creer VLAN + trunk","OSPF 2 routeurs area 0"],"c":"vlan 10\nrouter ospf 1\nnetwork 192.168.1.0 0.0.0.255 area 0\nshow ip ospf neighbor\ncopy run start","p":["FULL=OK"],"w":"Telnet banni."}]}];const QCM=[{"q":"169.254.10.5 ?","c":["IP publique","Echec DHCP (APIPA)","DNS OK","VPN"],"a":1,"e":"Pas de DHCP."},{"q":"Ordre diag ?","c":["DNS d'abord","Physique>IP>passerelle>DNS>Internet","Hasard","Internet d'abord"],"a":1,"e":"Entonnoir."},{"q":"Incident vs probleme ?","c":["Pareil","Incident=coupure, probleme=cause racine","Moins grave","Demande=incident"],"a":1,"e":"ITIL."},{"q":"100 users AD ?","c":["Import-Csv + New-ADUser","Copier","Ping","Reboot"],"a":0,"e":"Boucle CSV."},{"q":"FSMO ?","c":["3","5, schema unique foret","7","1"],"a":1,"e":"5 roles."},{"q":"AGDLP ?","c":["Users direct","Users>G>DL>ACL","Everyone","Rien"],"a":1,"e":"Bonne pratique."},{"q":"NTFS vs partage ?","c":["Plus restrictif gagne","Plus large","NTFS seul","Partage seul"],"a":0,"e":"Intersection."},{"q":"chmod script ?","c":["777","750","000","644"],"a":1,"e":"rwxr-x---."},{"q":"Service Linux ?","c":["systemctl status + journalctl","Reboot","rm","ping"],"a":0,"e":"systemd."},{"q":"Cron 2h30 ?","c":["30 2 * * *","2 30 * * *","* * *","jamais"],"a":0,"e":"m h dom."},{"q":"HTTPS ?","c":["80","443","22","53"],"a":1,"e":"443."},{"q":"DNS ?","c":["80","53","443","25"],"a":1,"e":"53."},{"q":"Hotes /26 ?","c":["254","126","62","30"],"a":2,"e":"2^6-2."},{"q":"Trunk ?","c":["Plusieurs VLAN","Alim","WiFi","DHCP"],"a":0,"e":"802.1Q."},{"q":"OSPF voisins ?","c":["show ip ospf neighbor","show vlan","ping","show nat"],"a":0,"e":"FULL."},{"q":"PAT ?","c":["1 publique pour N privees","1:1","Bloque","DHCP"],"a":0,"e":"Overload."},{"q":"HA ?","c":["Zero coupure","Redemarre VM sur survivant","Clone","Sauvegarde"],"a":1,"e":"Coupure courte."},{"q":"Snapshot ?","c":["Sauvegarde","Delta temporaire","Clone","Template"],"a":1,"e":"Pas sauvegarde."},{"q":"3-2-1 ?","c":["3 copies 2 supports 1 hors site","3 disques","Meme NAS","1/an"],"a":0,"e":"+test."},{"q":"RPO vs RTO ?","c":["Pareil","Perte max vs duree max arret","Reboot","Taille"],"a":1,"e":"15min/4h."},{"q":"show vlan ?","c":["show vlan brief","show ip route","show ver","show nat"],"a":0,"e":"VLAN."},{"q":"Hotes /27 ?","c":["62","30","126","14"],"a":1,"e":"2^5-2."},{"q":"/30 usage ?","c":["LAN","Liaison 2 hotes","DMZ","WiFi"],"a":1,"e":"4 adresses."},{"q":"/24 en /26 ?","c":["2x126","4x62","8x30","1"],"a":1,"e":".0 .64 .128 .192."},{"q":"DR/BDR ?","c":["Limitent LSA","Chiffrent","IP auto","Web"],"a":0,"e":"Multi-acces."},{"q":"ACL etendue ?","c":["Filtre IP+port","VLAN","WiFi","NAT"],"a":0,"e":"access-list."},{"q":"DHCP snooping ?","c":["Anti DHCP pirate","Boost WiFi","VLAN","QoS"],"a":0,"e":"DAI."},{"q":"STP ?","c":["Anti boucles","Route","NAT","VPN"],"a":0,"e":"BPDU."},{"q":"EtherChannel ?","c":["Agrege LACP","1 cable","VPN","DNS"],"a":0,"e":"2-8 liens."},{"q":"IPv6 link-local ?","c":["fe80::/10","192.168","10.0","127.0"],"a":0,"e":"Non routable."},{"q":"copy run start ?","c":["Sauve NVRAM","Reboot","Efface","Ping"],"a":0,"e":"Sinon perdu."},{"q":"Sysprep ?","c":["Inutile","Nettoie SID","Formate","Drivers"],"a":1,"e":"generalize."},{"q":"GPO ?","c":["gpupdate /force","ping","reboot PC","rm"],"a":0,"e":"Appliquer."},{"q":"RAID5 ?","c":["0","1 disque","2","Tous"],"a":1,"e":"Parite."},{"q":"SSH vs Telnet ?","c":["Pareil","SSH chiffre","Telnet mieux","Aucun"],"a":1,"e":"Bannir telnet."},{"q":"VLSM ?","c":["Gros d'abord","Petit","Hasard","/24"],"a":0,"e":"Anti gaspi."},{"q":"PXE ?","c":["Boot reseau","USB","CD","Disque"],"a":0,"e":"WDS."},{"q":"RTO 4h ?","c":["Perte 4h","Remonter en 4h max","Backup 4h","Rien"],"a":1,"e":"Duree arret."},{"q":"Asterisk port ?","c":["5060 SIP","80","443","22"],"a":0,"e":"+RTP."},{"q":"DMZ ?","c":["WAN>DMZ ok, DMZ>LAN non","Tout ouvert","Tout ferme","LAN>WAN non"],"a":0,"e":"Tampon."}];function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}var cur=null,tab={};function menu(f){var m=document.getElementById('menu'),h='',gr='TSSR';DATA.forEach(function(s){if(s.id==='ccna')gr='CCNA';if(s.id==='exam')return;if(s.id==='ccp1'||s.id==='ccna')h+='<div class=g>'+gr+'</div>';var c=f?f(s):'';h+='<a data-id="'+s.id+'" onclick="show(\''+s.id+'\')">'+esc(s.t)+' '+c+'</a>'});h+='<div class=g>Examen</div><a class=ex data-id=exam onclick="showExam()">Examen blanc 40Q</a>';m.innerHTML=h;upd()}function upd(){var d=0,t=0;DATA.forEach(function(s){s.f.forEach(function(f,i){t++;if(localStorage.getItem('v41-'+s.id+'-'+i))d++})});document.querySelector('#bar i').style.width=(t?Math.round(d/t*100):0)+'%';var m=document.getElementById('menu');if(m&&!document.getElementById('q').value)m.querySelectorAll('a[data-id]').forEach(function(a){var s=DATA.find(function(x){return x.id===a.getAttribute('data-id')});if(!s||s.id==='exam')return;var dd=0;s.f.forEach(function(_,i){if(localStorage.getItem('v41-'+s.id+'-'+i))dd++});var b=a.querySelector('b');if(!b){a.innerHTML+=' <b></b>';b=a.querySelector('b')}b.textContent='('+dd+'/'+s.f.length+')'})}function show(id){cur=id;document.querySelectorAll('#menu a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-id')===id)});var s=DATA.find(function(x){return x.id===id});var h='<div class=hero><h2>'+esc(s.t)+'</h2><span class=bd>'+s.f.length+' fiches</span><span class=bd>GUI + CLI</span></div>';s.f.forEach(function(f,i){var k='v41-'+s.id+'-'+i,ck=localStorage.getItem(k)?'checked':'';var t=tab[s.id+'-'+i]||'gui';var body=t==='gui'?'<ul class=pts>'+f.g.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<pre><code>'+esc(f.c)+'</code></pre> <button class=btn onclick="copy(this)">Copier</button>';h+='<div class=card><h3>'+esc(f.t)+'</h3><p>'+esc(f.r)+'</p><div class=tabs><button class="'+(t==='gui'?'on':'')+'" onclick="setTab(\''+s.id+'\','+i+',\'gui\')">GUI</button><button class="'+(t==='cli'?'on':'')+'" onclick="setTab(\''+s.id+'\','+i+',\'cli\')">CLI</button></div>'+body+'<ul class=pts>'+f.p.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'+(f.w?'<div class=warn>'+esc(f.w)+'</div>':'')+'<label><input type=checkbox '+ck+' onchange="chk(\''+k+'\',this.checked)"> Fiche apprise</label></div>')});h+='<div style="margin:10px 0"><button class=btn onclick="window.print()">Imprimer / PDF</button></div>';document.getElementById('content').innerHTML=h}function setTab(id,i,v){tab[id+'-'+i]=v;show(id)}function chk(k,v){if(v)localStorage.setItem(k,'1');else localStorage.removeItem(k);upd()}function copy(b){var t=b.previousElementSibling.innerText;navigator.clipboard.writeText(t);b.textContent='Copie !';setTimeout(function(){b.textContent='Copier'},1200)}function search(v){v=v.toLowerCase();if(!v){menu();if(cur&&cur!=='exam')show(cur);return}var m=document.getElementById('menu'),h='';DATA.forEach(function(s){if(s.id==='exam')return;var n=s.f.filter(function(f){return (f.t+f.r+f.c).toLowerCase().includes(v)});if(n.length)h+='<a data-id="'+s.id+'" onclick="show(\''+s.id+'\')">'+esc(s.t)+' ('+n.length+')</a>'});m.innerHTML=h||'Aucun resultat';if(!v)return;var h2='<div class=hero><h2>Resultats : '+esc(v)+'</h2></div>';DATA.forEach(function(s){s.f.forEach(function(f){if((f.t+f.r+f.c).toLowerCase().includes(v))h2+='<div class=card><h3>'+esc(f.t)+' <small style=color:#a78bfa>'+esc(s.t)+'</small></h3><p>'+esc(f.r)+'</p><pre><code>'+esc(f.c)+'</code></pre></div>'})});document.getElementById('content').innerHTML=h2}var sec=3600,timer=null;function showExam(){cur='exam';document.querySelectorAll('#menu a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-id')==='exam')});sec=3600;clearInterval(timer);var h='<div class=hero><h2>Examen blanc — 40 questions</h2><span class=bd>20 TSSR + 20 CCNA</span><span class=bd id=timer>60:00</span></div><div id=qlist>';QCM.forEach(function(q,i){h+='<div class=q id=q'+i+'><b>Q'+(i+1)+'. '+esc(q.q)+'</b>';q.c.forEach(function(c,j){h+='<label style="display:block;margin:4px 0"><input type=radio name=q'+i+' value='+j+'> '+esc(c)+'</label>'});h+='<div class=corr style="display:none;color:#a78bfa;font-size:.85rem">'+esc(q.e)+'</div></div>'});h+='</div><button class=btn onclick="corriger()">Corriger</button> <button class=btn onclick="showExam()">Recommencer</button><div id=res style="margin:12px 0;font-weight:800"></div>';document.getElementById('content').innerHTML=h;timer=setInterval(function(){sec--;var mm=Math.floor(sec/60),ss=sec%60;var e=document.getElementById('timer');if(e)e.textContent=mm+':'+String(ss).padStart(2,'0');if(sec<=0){clearInterval(timer);corriger()}},1000)}function corriger(){clearInterval(timer);var bon=0;QCM.forEach(function(q,i){var sel=document.querySelector('input[name=q'+i+']:checked');var box=document.getElementById('q'+i);box.querySelector('.corr').style.display='block';if(sel&&+sel.value===q.a){bon++;box.classList.add('c-ok')}else box.classList.add('c-ko')});var note=Math.round(bon/QCM.length*20);document.getElementById('res').textContent='Score : '+bon+'/'+QCM.length+' — Note : '+note+'/20 '+(note>=10?'Recu !':'A retravailler.');window.scrollTo(0,0)}menu();show("ccp1")</script></body></html>
