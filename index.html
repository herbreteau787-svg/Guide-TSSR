<!DOCTYPE html><html lang=fr><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Guide TSSR + CCNA — Fiches & Examen blanc</title><style>*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui;background:#0b1220;color:#e2e8f0;display:flex;min-height:100vh}nav{width:300px;background:linear-gradient(180deg,#1e1b4b,#0f172a);padding:18px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid #312e81}nav h1{font-size:1.2rem;margin:0;background:linear-gradient(90deg,#a78bfa,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}nav input{width:100%;padding:10px;border-radius:10px;border:1px solid #4338ca;background:#0b1220;color:#fff;margin:10px 0}#bar{height:8px;background:#020617;border-radius:99px;overflow:hidden;margin-bottom:12px}#bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);width:0;transition:.3s}nav a{display:block;padding:9px 10px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-size:.88rem;cursor:pointer;margin-bottom:2px}nav a:hover{background:#312e81;color:#fff}nav a.on{background:linear-gradient(90deg,#7c3aed,#2563eb);color:#fff}nav a.ex{border:1px solid #22c55e}.grp{font-size:.72rem;color:#a78bfa;margin:14px 0 5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}main{flex:1;padding:0;max-width:980px}.hero{background:linear-gradient(120deg,#4c1d95,#1e40af 60%,#0e7490);padding:34px 30px;border-radius:0 0 24px 24px;margin-bottom:18px}.hero h2{margin:0;font-size:1.6rem}.hero p{color:#cbd5e1}.wrap{padding:0 26px 40px}.card{background:linear-gradient(180deg,#1e293b,#0f172a);border:1px solid #334155;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}.card h3{margin:0 0 6px;font-size:1.08rem}.badge{display:inline-block;font-size:.72rem;background:#312e81;color:#ddd6fe;border-radius:99px;padding:2px 9px;margin-right:6px}.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{background:#020617;color:#cbd5e1;border:1px solid #334155;border-radius:99px;padding:6px 13px;cursor:pointer;font-size:.82rem}.tabs button.on{background:#7c3aed;color:#fff;border-color:#7c3aed}pre{background:#020617;padding:12px;border-radius:10px;overflow-x:auto;border:1px solid #1e293b}code{color:#6ee7b7;font-size:.82rem;white-space:pre-wrap}.pts{color:#cbd5e1;font-size:.92rem;line-height:1.6}.warn{background:#451a03;border-left:4px solid #fb923c;color:#fed7aa;padding:10px;border-radius:8px;margin:10px 0;font-size:.88rem}.q{border:1px solid #334155;border-radius:12px;padding:12px;margin-bottom:10px;background:#0f172a}.q label{display:block;background:#1e293b;border-radius:8px;padding:8px;margin:6px 0;cursor:pointer}.q label:hover{border:1px solid #7c3aed}.btn{background:linear-gradient(90deg,#7c3aed,#2563eb);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:.95rem}.btn:hover{filter:brightness(1.15)}@media(max-width:800px){body{flex-direction:column}nav{width:100%;height:auto;position:static}.hero{border-radius:0}}@media print{nav{display:none}body{display:block}.hero{border-radius:0}}</style></head><body><nav><h1>🎓 Guide TSSR + CCNA</h1><input id=q placeholder='🔎 Rechercher (VLAN, AD, OSPF…)' oninput='search(this.value)'><div id=bar><i></i></div><div id=pct style='font-size:.78rem;color:#a78bfa;margin-bottom:8px'></div><div id=menu></div></nav><main id=content></main><script>const DATA=[{"id":"ccp1","t":"CCP1 · Support & centre de services","f":[{"t":"Tickets : incident, problème, demande + SLA","r":"En centre de services, tout passe par le ticket. Incident = service interrompu ou dégradé à rétablir vite (ex : plus d'impression, réseau coupé). Problème = cause racine qui génère plusieurs incidents (ex : driver défectueux). Demande de service = besoin prévu et validé (création de compte, nouveau PC, accès). On qualifie chaque ticket : qui, quoi, où, quand, périmètre (1 poste ou service entier), criticité. Priorité = Impact × Urgence. SLA usuels : P1 bloquant 4h, P2 urgent 8h, P3 normal 24h, P4 confort 72h. N1 : accueil et solutions connues. N2 : diagnostic technique. N3 : expert / éditeur. Chaque action est tracée avec durée pour prouver le respect du SLA.","g":["GLPI > Assistance > Tickets > Nouveau : titre explicite type [LIEU][POSTE] panne impression","Renseigner : demandeur, catégorie Matériel/Logiciel/Réseau, urgence, impact, description + capture","Attribuer au bon groupe N1/N2, ajouter suivi à chaque test effectué","Faire valider la résolution par l'utilisateur puis clôturer + créer article base de connaissances"],"c":"ipconfig /all\nping 8.8.8.8\nping srv-fichiers.lan\nnslookup srv-fichiers.lan\nTest-NetConnection srv-fichiers.lan -Port 445","p":["Toujours demander le message d'erreur exact + photo écran","Tester avec un autre compte pour isoler profil vs poste","Escalader dès que hors périmètre ou SLA en danger"],"w":"Ne jamais clôturer sans validation utilisateur : ticket rouvert = pénalité en examen."},{"t":"Diagnostic réseau poste (méthode entonnoir)","r":"On avance par couches : 1) Physique : câble, voyant carte, Wi-Fi, mode avion. 2) IP : adresse valide ? Si 169.254.x.x c'est APIPA = aucun DHCP joignable. 3) Passerelle : ping de la gateway = routeur local OK. 4) DNS : nslookup doit résoudre google.com. 5) Internet : ping 8.8.8.8. Si IP OK mais nom KO = panne DNS. Si gateway KO = problème local (câble, VLAN, switch). On note chaque résultat dans le ticket.","g":["Vérifier voyant RJ45 + icône réseau barre des tâches","Paramètres > Réseau et Internet > État : profil Privé, pas de croix rouge","Centre Réseau et partage > Connexion > Détails : IP, masque, passerelle, DNS","Tester navigation + ping intranet puis internet"],"c":"ipconfig /all\nping 192.168.1.1\nping 8.8.8.8\nnslookup google.com\ntracert -d google.com\nipconfig /release\nipconfig /renew\nipconfig /flushdns\nnetsh winsock reset","p":["APIPA = DHCP KO : vérifier service, câble, port switch, VLAN","Passerelle OK + Internet KO = box/routeur ou FAI","Nom KO + IP OK = DNS à corriger"],"w":"Ne pas confondre panne DNS et panne internet : testez toujours les deux."},{"t":"Compte AD : mot de passe, verrouillage, profil","r":"Avant toute réinitialisation, on vérifie l'identité (badge, manager, double facteur). On déverrouille le compte, on impose un mot de passe temporaire complexe, on coche changement obligatoire à la prochaine ouverture. On communique le temporaire par un canal séparé. On vérifie l'appartenance aux groupes et l'état du compte (activé, non expiré). Si le profil Windows est corrompu, on teste avec un autre compte sur le même poste pour isoler.","g":["ADUC (dsa.msc) > Users > clic droit utilisateur > Réinitialiser le mot de passe","Onglet Compte : décocher Verrouiller, vérifier Expiration et Heure d'ouverture","Propriétés > Membre de : vérifier groupes d'accès applicatifs","Tester ouverture de session sur le poste + accès lecteurs réseau"],"c":"Set-ADAccountPassword -Identity jdupont -Reset -NewPassword (ConvertTo-SecureString 'Temp2026!' -AsPlainText -Force)\nSet-ADUser -Identity jdupont -ChangePasswordAtLogon $true\nUnlock-ADAccount -Identity jdupont\nGet-ADUser jdupont -Properties LockedOut,Enabled,PasswordExpired","p":["Ne jamais envoyer le MDP en clair sur le même mail","Forcer le changement immédiat pour éviter réutilisation","Tracer l'opération dans le ticket"],"w":"Réinit sans vérification d'identité = faute grave le jour J."},{"t":"Poste Windows : démarrage, lenteurs, impressions","r":"Démarrage : vérifier BIOS/UEFI (ordre de boot, Secure Boot), disque détecté, WinRE si boucle. Lenteurs : disque plein à plus de 90%, HDD vs SSD, programmes au démarrage, Windows Update bloqué, antivirus en analyse. Impression : file spouleur, pilote, partage, test page. On utilise Observateur d'événements (System/Application), Gestionnaire des tâches, Nettoyage disque, sfc /scannow et DISM pour réparer l'image.","g":["Paramètres > Applications > Démarrage : désactiver l'inutile","Périphériques > Imprimantes : file d'attente > vider + page de test","Observateur d'événements > Journaux Windows > Système : erreurs disque/service","Windows Update > Historique : relancer les échecs"],"c":"sfc /scannow\nDISM /Online /Cleanup-Image /RestoreHealth\nchkdsk C: /f\nget-printjob -PrinterName \"HP-Accueil\"\nRestart-Service Spooler\nmsconfig","p":["Toujours relever le code d'erreur exact","Tester en mode sans échec pour isoler driver","Vérifier espace disque avant toute MAJ"],"w":"Couper une MAJ ou un chkdsk en cours peut rendre le poste non démarrable."}]},{"id":"ccp2","t":"CCP2 · Windows Server & Active Directory","f":[{"t":"Installer AD DS + DNS (forêt propre)","r":"Un contrôleur de domaine héberge AD DS + DNS intégré + synchronisation horaire. On prévoit toujours 2 DC minimum pour la résilience. Étapes : IP fixe, nom explicite (SRV-AD01), rôle AD DS + DNS, promotion en nouvelle forêt (ex : tssr.lan), mot de passe DSRM, vérification SYSVOL/NETLOGON partagés, dcdiag sans erreur. Le PDC émulateur devient la référence NTP du domaine.","g":["Gestionnaire de serveur > Ajouter rôles : AD DS + DNS, IP fixe avant promotion","Promouvoir : nouvelle forêt tssr.lan, niveau fonctionnel, MDP DSRM","Outils > DNS : zone directe tssr.lan + PTR ; Sites et services : vérifier sous-réseaux","Vérifier partages \\\\DC\\SYSVOL et \\NETLOGON"],"c":"Install-WindowsFeature AD-Domain-Services,DNS -IncludeManagementTools\nInstall-ADDSForest -DomainName tssr.lan -InstallDns\nGet-ADDomainController\ndcdiag /q\nrepadmin /replsummary","p":["IP fixe + DNS pointant vers lui-même avant promo","Ne jamais installer AD sur DHCP ou IP dynamique"],"w":"Un seul DC en production = point unique de panne, sanctionné à l'examen."},{"t":"FSMO : les 5 rôles sans les confondre","r":"Niveau forêt (uniques) : Maître de schéma (fait évoluer le schéma) + Maître d'attribution des noms (ajout/suppression de domaines). Niveau domaine (un par domaine) : PDC émulateur (temps, lockout, compat NT4), RID (distribue les pools de SID), Infrastructure (références inter-domaines). On les transfère proprement (ntdsutil ou console) et on ne fait un seize (saisie) qu'après panne définitive.","g":["ADUC > clic droit domaine > Maîtres d'opérations : voir RID/PDC/Infrastructure","Domaines et approbations > Maître d'attribution des noms","Schéma (regsvr32 schmmgmt) > Maître de schéma","Ntdsutil pour transfert en ligne de commande"],"c":"netdom query fsmo\nMove-ADDirectoryServerOperationMasterRole -Identity SRV-AD02 -OperationMasterRole PDCEmulator,RIDMaster -Force\nntdsutil roles connections","p":["Schéma + Nommage = uniques par forêt","PDC = horloge + verrouillages : à placer sur le DC le plus stable"],"w":"Seize un rôle alors que l'ancien DC va revenir = USN rollback et AD cassé."},{"t":"AGDLP + GPO : droits et stratégies","r":"AGDLP : Comptes utilisateurs dans Groupes Globaux (métier), Globaux dans Locaux de Domaine (droits), DL sur les ressources. Jamais d'utilisateur en direct dans les ACL. GPO : liées aux OU (jamais au groupe), ordre LSDOU (Local, Site, Domaine, OU), héritage + Enforced + Block. Toujours tester sur une OU pilote, filtrer par groupe, faire gpresult /r et gpupdate /force. Exemples : fond d'écran, lecteurs mappés, verrouillage session, déploiement MSI.","g":["ADUC : créer OU Pilote, GG_Compta, DL_Docs_RW ; imbriquer GG dans DL","GPMC (gpmc.msc) > OU > Créer GPO > Modifier : stratégies + préférences","Lier, filtrer sécurité Authenticated Users ou groupe métier, tester","Sur poste : gpupdate /force + gpresult /r pour valider"],"c":"New-ADGroup GG_Compta -GroupScope Global\nNew-ADGroup DL_Docs_RW -GroupScope DomainLocal\nAdd-ADGroupMember DL_Docs_RW -Members GG_Compta\ngpupdate /force\ngpresult /r /scope computer","p":["Une GPO = un objectif, nom explicite","Tester avant de lier à la racine"],"w":"Lier une GPO au domaine entier sans test peut bloquer tout le parc."},{"t":"DNS & DHCP Windows sans panne","r":"DNS AD intégré : zones primaires + réplication, enregistrements A/PTR/CNAME/SRV, vieillissement/nettoyage, redirecteurs (FAI ou 1.1.1.1), nslookup + dcdiag /test:dns. DHCP : étendue + plage d'exclusion (serveurs, imprimantes), bail 8 jours poste / 24h Wi-Fi invité, options 003 passerelle / 006 DNS / 015 suffixe, réservations par MAC, bascule DHCP (failover) ou superstition 80/20, sauvegarder config.","g":["DNS : console DNS > zone tssr.lan > nouvel hôte A + PTR associé","DHCP : Nouvelle étendue > exclusions > options 003/006/015 > activer","Réservations : clic droit > Nouvelle réservation (MAC + IP imprimante)","Sauvegarde : clic droit serveur > Sauvegarder"],"c":"Add-DnsServerPrimaryZone -Name tssr.lan -ZoneFile tssr.lan.dns\nAdd-DhcpServerv4Scope -Name LAN -StartRange 192.168.1.100 -EndRange 192.168.1.200 -SubnetMask 255.255.255.0\nAdd-DhcpServerv4ExclusionRange -ScopeId 192.168.1.0 -StartRange 192.168.1.1 -EndRange 192.168.1.20\nipconfig /release & ipconfig /renew","p":["Toujours PTR pour éviter alertes et reverse KO","Exclure serveurs/imprimantes de la plage dynamique"],"w":"Deux serveurs DHCP actifs sur le même VLAN = conflit et réseau instable."},{"t":"NTFS + partages + jonction au domaine","r":"Deux couches : autorisations NTFS (fichiers) + autorisations de partage (accès réseau). L'accès effectif = intersection des deux. Donc partage en Lecture/Modification large + affinage en NTFS par DL. Refus explicite prioritaire. Héritage : couper avec copie pour isoler un dossier sensible. Jonction : DNS du poste vers le DC, suffixe, compte autorisé, redémarrage, Test-ComputerSecureChannel pour réparer la relation.","g":["Clic droit dossier > Partage avancé > Autoriser + Sécurité NTFS : ajouter DL","Bouton Avancé > Désactiver héritage (Convertir) pour dossier sensible","Poste > Système > Domaine : tssr.lan, compte admin du domaine, redémarrer","Vérifier : whoami /groups + accès \\\\SRV\\Docs"],"c":"New-SmbShare -Name Docs -Path D:\\Docs -FullAccess 'TSSR\\DL_Docs_RW'\nicacls D:\\Docs /grant 'TSSR\\DL_Docs_RW:(OI)(CI)M'\nAdd-Computer -DomainName tssr.lan -Restart\nTest-ComputerSecureChannel -Repair","p":["Partage large + NTFS fin = règle d'or","Documenter chaque DL et son usage"],"w":"Everyone Contrôle total sur un partage = faute éliminatoire."}]},{"id":"ccp3","t":"CCP3 · Linux (postes & serveurs)","f":[{"t":"Arborescence, nano/vim, paquets APT","r":"Arborescence : /etc configurations, /var logs et spool, /home utilisateurs, /opt applis, /boot noyau. Fichiers clés : /etc/passwd, /etc/shadow, /etc/group, /etc/fstab, /etc/hosts, /etc/hostname, /etc/resolv.conf, /etc/ssh/sshd_config, /etc/crontab. Édition : nano simple (Ctrl+O, Ctrl+X), vim en 3 modes (i insertion, Échap commande, :w/:q). Paquets Debian/Ubuntu : apt update (liste), apt upgrade (maj), apt install/remove/purge, apt search/show, dpkg -l. Toujours apt update avant install.","g":["Ubuntu Server : cocher OpenSSH + LVM à l'install","Desktop : Logiciels Ubuntu pour install en GUI","Disques (gnome-disks) : formater, monter","gedit / VS Code Remote-SSH pour éditer /etc"],"c":"ls -la /etc\ncat /etc/os-release\nnano /etc/hostname\napt update && apt upgrade -y\napt install -y nginx htop ncdu\napt search fail2ban\napt show openssh-server\ndpkg -l | grep nginx\ntar -czf /srv/sav/etc-$(date +%F).tgz /etc","p":["Tester la conf avant de redémarrer le service","Sauvegarder /etc avant modification"],"w":"Éditer /etc sans sauvegarde = risque examen."},{"t":"Droits chmod/chown, users, sudo","r":"Droits rwx = 4-2-1. Fichier standard 640 (rw-r-----), dossier 750 (rwxr-x---), script 750. chmod 640 conf, chown user:group fichier. useradd -m -s /bin/bash login, passwd login, usermod -aG sudo login (le -a est vital sinon on écrase les groupes), id login. Sudo via visudo uniquement (vérifie la syntaxe). Verrouiller : usermod -L / passwd -l.","g":["Paramètres > Utilisateurs (desktop)","Cockpit : Comptes > créer + rôles admin"],"c":"chmod 640 /etc/app.conf\nchmod 750 /opt/app\nchown -R app:app /opt/app\nuseradd -m -s /bin/bash lea\npasswd lea\nusermod -aG sudo lea\nid lea\nvisudo\nsudo -l","p":["Jamais 777 même pour tester","Toujours -a avec -G"],"w":"chmod 777 ou usermod sans -a = faute grave."},{"t":"systemd, logs, réseau, SSH, cron","r":"systemd : systemctl enable/start/restart/status/is-enabled service, daemon-reload après modif unit. Logs : journalctl -u service -f, journalctl -p err -b, /var/log/syslog et auth.log, dmesg. Réseau Debian : /etc/netplan/*.yaml puis netplan apply, ip a, ip r, resolvectl status. SSH durci : clés ed25519, PasswordAuthentication no, PermitRootLogin no, fail2ban. Cron : m h dom mon dow, crontab -e par user, /etc/crontab système.","g":["Cockpit https://srv:9090 : services, logs, terminal web","Fichiers > réseau pour test SMB"],"c":"systemctl enable --now ssh\nsystemctl status nginx --no-pager\njournalctl -u ssh -f\nip a\nip r\ncat /etc/netplan/50-cloud-init.yaml\nsudo netplan apply\nssh-keygen -t ed25519\nssh-copy-id lea@srv\ncrontab -e\n# 2h30 chaque jour :\n30 2 * * * /opt/backup.sh >> /var/log/backup.log 2>&1","p":["Tester le script à la main avant cron","Chemins absolus en cron"],"w":"Root en SSH par mot de passe = éliminatoire."}]},{"id":"ccp4","t":"CCP4 · Réseau, DHCP/DNS, Cisco","f":[{"t":"Ports, protocoles et acronymes","r":"À connaître par coeur. Web : 80 HTTP, 443 HTTPS. Mail : 25 SMTP, 587 soumission, 110 POP3, 143 IMAP, 993 IMAPS, 995 POP3S. Fichiers : 21 FTP, 22 SSH/SFTP/SCP, 445 SMB, 2049 NFS, 69 TFTP. Infra : 53 DNS, 67/68 DHCP, 123 NTP, 161/162 SNMP, 389 LDAP, 636 LDAPS, 88 Kerberos, 3389 RDP, 5060 SIP, 1723 PPTP, 1194 OpenVPN, 500/4500 IPsec. Acronymes : LAN/VLAN, WAN, DMZ, NAT/PAT, QoS, PoE, AP, SSID, FHRP (HSRP/VRRP).","g":["Wireshark : filtre tcp.port==443 pour voir HTTPS","Packet Tracer : mode Simulation pour suivre un ping"],"c":"Test-NetConnection srv -Port 443\nTest-NetConnection srv -Port 3389\nnslookup intranet.lan\nshow ip interface brief","p":["Fiche ports = 5 points faciles à l'écrit","UDP pour voix/vidéo, TCP pour fiable"],"w":"Confondre 25/587 ou 110/995 = piège classique."},{"t":"Subnetting et CIDR méthode exam","r":"Formule hôtes = 2^(32-masque) - 2. Repères : /24 = 254 hôtes, /25 = 126, /26 = 62, /27 = 30, /28 = 14, /29 = 6, /30 = 2 (liaisons point-à-point). Découper : emprunter n bits = 2^n sous-réseaux. Exemple : 192.168.10.0/24 en /26 donne 4 blocs de 64 adresses : .0, .64, .128, .192 (62 hôtes chacun, broadcast .63, .127, .191, .255). VLSM : servir le plus gros besoin en premier pour ne pas gaspiller.","g":["ipcalc / SolarWinds Subnet Calculator pour vérifier","Packet Tracer : adresser 3 LAN de tailles différentes"],"c":"192.168.10.0/26 :\nBloc1 .1-.62 gw .1 bc .63\nBloc2 .65-.126 gw .65 bc .127\nBloc3 .129-.190 gw .129 bc .191\nBloc4 .193-.254 gw .193 bc .255\n# Vérif rapide :\nipcalc 192.168.10.0/26","p":["Apprendre la table /24 à /30 par coeur","Toujours retirer réseau + broadcast"],"w":"Oublier -2 = réponse fausse."},{"t":"DHCP et DNS : théorie + dépannage","r":"DHCP DORA : Discover, Offer, Request, Ack. Portée avec plage, durée de bail, passerelle, DNS, exclusions. Réservation par MAC pour imprimantes/serveurs. Relais DHCP (ip helper) entre VLANs. DNS : A (IPv4), AAAA (IPv6), CNAME (alias), MX (mail), PTR (inverse), SRV (services AD), NS et SOA. Ordre de résolution : cache, hosts, DNS. APIPA 169.254 = DHCP KO. ping IP OK mais nom KO = DNS KO.","g":["Windows : DHCP.msc (plage, baux, réservations), DNS.msc (zones A/PTR)","IP du poste en GUI : Paramètres > Réseau"],"c":"ipconfig /all\nipconfig /release\nipconfig /renew\nipconfig /flushdns\nnslookup srv.tssr.lan\nGet-DhcpServerv4Scope\nGet-DnsServerZone\n# Cisco :\nip helper-address 192.168.1.10","p":["Réservation MAC pour équipements fixes","Toujours tester nslookup + ping"],"w":"Deux serveurs DHCP sur le même LAN = conflit."},{"t":"Cisco IOS : base + VLAN + dépannage","r":"Modes : user >, enable #, config (config)#. hostname, enable secret, line console/vty avec login + password, service password-encryption. Interfaces : ip address + no shutdown. VLAN : vlan 10, name, interface en access (switchport mode access, switchport access vlan 10), trunk (switchport mode trunk, 802.1Q). Sauvegarde : copy running-config startup-config. Vérif : show running-config, show ip int brief, show vlan brief, show ip route, show interfaces status.","g":["Packet Tracer : CLI de chaque switch/routeur + onglet GUI Config","Wireshark sur lien trunk pour voir les tags"],"c":"enable\nconfigure terminal\nhostname SW1\nenable secret Tssr2026!\ninterface vlan 1\n ip address 192.168.1.2 255.255.255.0\n no shutdown\nvlan 10\n name COMPTA\ninterface fa0/1\n switchport mode access\n switchport access vlan 10\ninterface gi0/1\n switchport mode trunk\ncopy running-config startup-config\nshow vlan brief\nshow ip interface brief","p":["Ne jamais oublier no shutdown","Sauvegarder avant de quitter"],"w":"VLAN créé mais port resté en VLAN 1 = erreur n°1."}]},{"id":"ccp5","t":"CCP5 · Virtualisation (VMware & Hyper-V)","f":[{"t":"vSphere : ESXi, vCenter, cluster, stockage","r":"ESXi = hyperviseur bare-metal installé sur chaque hôte physique. vCenter = administration centralisée (web client), licences, droits, templates, clones. Cluster = pool CPU/RAM avec HA (redémarre VM si hôte mort) et DRS (équilibre la charge). Stockage : local, NFS, iSCSI, Fibre Channel, vSAN. Datastore = espace où vivent les VMDK. Réseau : vSwitch standard ou distribué, port groups, VMkernel (vMotion, management). VMware Tools dans chaque VM : drivers + arrêt propre + heure.","g":["vSphere Client : Hôtes et clusters > Nouveau Datacenter > Ajouter hôte","Créer VM : ISO, 2 vCPU/4 Go, disque thin, réseau VM Network, VMXNET3","Installer VMware Tools : clic VM > Install Tools","Snapshot : Take Snapshot (nom + date), Revert, Delete"],"c":"esxcli system version get\nesxcli network vswitch standard list\nvim-cmd vmsvc/getallvms\n# Vérif datastore plein :\ndf -h","p":["VMXNET3 + PVSCSI pour perfs","Tools à jour = prérequis HA/vMotion"],"w":"Snapshot = delta temporaire, jamais une sauvegarde."},{"t":"HA, vMotion, snapshots : ce que l'exam attend","r":"HA : sur panne d'hôte, les VM redémarrent sur les survivants (coupure courte). Pas de zéro-coupure : ça c'est Fault Tolerance. vMotion : déplace une VM allumée sans coupure (même stockage ou Storage vMotion pour changer de datastore). DRS : déplace auto selon charge. Snapshot : fige l'état + delta. Un seul snapshot court pour test/maj, puis consolidation + suppression. Snapshot oublié qui grossit = datastore plein = toutes les VM en panne. Toujours vérifier chaînage et espace avant maj.","g":["Activer HA : Cluster > Configurer > vSphere HA ON + admission control","vMotion : Migrer > Changer calcul + stockage, tester sans coupure ping","Snapshot : vérifier gestionnaire, supprimer après tests"],"c":"ping VM-pendant-vmotion -t\n# Côté Hyper-V équivalent :\nGet-VM\nCheckpoint-VM -Name TEST -SnapshotName Avant-MAJ\nRemove-VMSnapshot -VMName TEST -Name Avant-MAJ","p":["Tester vMotion avec ping continu","Planifier suppression snapshot J+1"],"w":"2 ans de snapshots empilés = scénario catastrophe classique à l'oral."},{"t":"Hyper-V : rôle, vSwitch, checkpoints","r":"Hyper-V = rôle Windows Server ou Windows 10/11 Pro. vSwitch : externe (physique+VM), interne (hôte+VM), privé (VM seules). VM : génération 2 (UEFI), VHDX dynamique/fixe, points de contrôle (checkpoints) = snapshots. Replica pour PRA léger. Mémoire dynamique, processeurs virtuels, intégration via services invités.","g":["Gestionnaire Hyper-V : Nouveau > VM > Génération 2 > VHDX > mémoire","Commutateur virtuel : Externe lié à la carte physique","Checkpoint : clic VM > Point de contrôle, Appliquer, Supprimer"],"c":"Install-WindowsFeature Hyper-V -IncludeManagementTools\nGet-VMSwitch\nNew-VMSwitch -Name LAN -NetAdapterName Ethernet -AllowManagementOS $true\nGet-VM | Select Name,State","p":["VHDX fixe en prod, dynamique en test","Un checkpoint = test court"],"w":"Checkpoint de prod gardé 6 mois = même faute que snapshot VMware."}]},{"id":"ccp6","t":"CCP6 · Scripts & automatisation","f":[{"t":"Bash : squelette robuste + args","r":"Toujours : #!/bin/bash, set -euo pipefail (stop si erreur, var vide, pipe KO). Arguments : $1 premier, $# nombre, $0 nom, $? dernier code (0=OK). Tests : [ -f fichier ], [ -d dossier ], [ -z var ]. Guillemets autour des variables \"$1\" pour espaces. Logs avec date. Rendre exécutable chmod +x.","g":["VS Code + extension Bash : debug pas-à-pas","Tester à la main avec jeu d'essai avant cron"],"c":"#!/bin/bash\nset -euo pipefail\nif [ $# -ne 1 ]; then echo \"Usage: $0 dossier\"; exit 1; fi\nif [ ! -d \"$1\" ]; then echo \"$1 introuvable\"; exit 2; fi\nDEST=\"/srv/sav/$(date +%F)\"\nmkdir -p \"$DEST\"\ncp -a \"$1\" \"$DEST/\"\necho \"Sauvegarde OK dans $DEST\"\n# rendre exécutable :\n# chmod +x backup.sh","p":["Quoter \"$var\" systématiquement","Codes retour explicites 1,2…"],"w":"rm -rf $DOSSIER sans guillemets = suppression racine possible."},{"t":"PowerShell : pipeline + erreurs + AD","r":"Pipeline objet : Get | Where | Select | Sort | Export-Csv. Cmdlets verbe-nom : Get-ADUser, New-ADUser, Get-Service. Erreurs : try/catch avec -ErrorAction Stop (sinon non interceptée). $_ = erreur courante. ExecutionPolicy : RemoteSigned scope CurrentUser pour scripts locaux. Modules : ActiveDirectory, SmbShare.","g":["ISE / VS Code : exécuter ligne par ligne (F8)","Planificateur : action powershell.exe -File C:\\Scripts\\sav.ps1"],"c":"Import-Csv .\\users.csv | ForEach-Object {\n New-ADUser -Name $_.Nom -SamAccountName $_.Login -Enabled $true -AccountPassword (ConvertTo-SecureString 'Temp2026!' -AsPlainText -Force)\n}\nGet-Service | Where-Object Status -eq 'Stopped' | Select Name,DisplayName\ntry { Get-Content C:\\absent.txt -ErrorAction Stop } catch { Write-Warning \"Erreur : $($_.Exception.Message)\" }\nGet-ExecutionPolicy\nSet-ExecutionPolicy RemoteSigned -Scope CurrentUser","p":["Tester sur OU TEST avant prod","Exporter CSV avant modif massive"],"w":"Boucle AD sans OU test = 500 comptes créés au mauvais endroit."},{"t":"Planifier : cron + tâches Windows + logs","r":"Cron Linux : minute heure jour mois jour-semaine commande. Ex 30 2 * * * = 2h30 du matin. crontab -e par user, /etc/crontab système. Chemins absolus obligatoires, rediriger sorties >> /var/log/job.log 2>&1. Windows : schtasks ou Planificateur GUI (déclencheur quotidien, compte de service, cocher même si fermé). Toujours journaliser + alerter si code !=0.","g":["Planificateur > Créer tâche > Déclencheur quotidien 2h30 > Programme .ps1/.bat","gnome-schedule pour cron en GUI sur desktop"],"c":"# cron 2h30 + log :\n30 2 * * * /opt/backup.sh >> /var/log/backup.log 2>&1\ncrontab -l\n# Windows :\nschtasks /create /tn Sauvegarde /tr \"C:\\Scripts\\backup.cmd\" /sc daily /st 02:30\nschtasks /query /tn Sauvegarde","p":["Tester manuel avant auto","Vérifier logs le lendemain"],"w":"Cron sans chemin absolu = échec silencieux la nuit."}]},{"id":"ccp7","t":"CCP7 Secu pfSense + DMZ","f":[{"t":"pfSense regles NAT VPN","r":"Pare-feu stateful : premiere regle qui matche gagne. WAN bloque par defaut, LAN ouvert a restreindre. NAT/PAT pour sortie, VPN IPsec site-a-site ou OpenVPN nomade, proxy Squid.","g":["pfSense web : Aliases puis Rules LAN puis NAT","VPN OpenVPN via Wizard"],"c":"ping 8.8.8.8\nnslookup google.com\npfctl -sr | head","p":["Deny all en fin"],"w":"Any-Any = faute grave."},{"t":"DMZ + Apache","r":"DMZ zone tampon : WAN vers DMZ 80/443 OK, DMZ vers LAN interdit, LAN vers DMZ OK. Apache VirtualHost + Require ip LAN.","g":["OPT1 = DMZ 10.0.0.1/24","Apache a2ensite"],"c":"a2ensite intranet\nsystemctl reload apache2","p":["Logs separes"],"w":"DMZ vers LAN = plus de DMZ."}]},{"id":"ccp8","t":"CCP8 Sauvegardes PRA PCA","f":[{"t":"3-2-1 RPO RTO tests","r":"3 copies, 2 supports, 1 hors site. Complete, incrementielle, differentielle. RPO perte max, RTO duree max arret. PRA remonter, PCA continuer. Tester restauration.","g":["Veeam job quotidien + complete hebdo","Test restore 1 fichier + 1 VM"],"c":"rsync -a --delete /srv/ /mnt/sav/jour/\ntar -czf /mnt/sav/etc-$(date +%F).tgz /etc","p":["Alerte si job rouge"],"w":"Meme disque = pas de protection."}]},{"id":"ccp9","t":"CCP9 Deploiement et ToIP","f":[{"t":"Image Sysprep WDS PXE","r":"Image ref en VM, Sysprep generalize oobe, capture WIM, deploiement PXE WDS ou MDT. DHCP options 66/67.","g":["WDS Images Capture + Install","Client F12 PXE"],"c":"sysprep /oobe /generalize /shutdown","p":["VLAN dedie"],"w":"Sans Sysprep = SID dupliques."},{"t":"ToIP Asterisk","r":"SIP 5060, RTP 10000-20000. Dialplan, VLAN voix + QoS EF.","g":["FreePBX Extensions Trunks Routes"],"c":"asterisk -rvvv\npjsip show endpoints","p":["Separ voix data"],"w":"Sans QoS = voix hachee."}]},{"id":"ccna1","t":"CCNA 1 Fondamentaux + subnetting","f":[{"t":"OSI TCP-IP IPv4 IPv6","r":"OSI 7 couches, TCP fiable avec handshake, UDP rapide. IPv4 32 bits, prive 10/8 172.16/12 192.168/16, APIPA 169.254. IPv6 128 bits, link-local fe80::/10. Cablage droit/croise, Auto-MDIX.","g":["Packet Tracer 2 PC + switch, mode Simulation","Wireshark handshake TCP"],"c":"show ip interface brief\nping 8.8.8.8\nipcalc 192.168.1.0/24","p":["APIPA = DHCP KO"],"w":"Masque vs wildcard."},{"t":"Subnetting methode exam","r":"Hotes = 2^(32-masque)-2. /24 254, /25 126, /26 62, /27 30, /28 14, /30 2 (liaisons). Ex 192.168.1.0/24 en /26 = 4x62 (.0 .64 .128 .192). VLSM : plus gros besoin d'abord.","g":["ipcalc pour verifier","Packet Tracer 3 LAN tailles differentes"],"c":"# /26 : bloc 64\n192.168.1.0/26 .1-.62\n192.168.1.64/26 .65-.126\n192.168.1.128/26\n192.168.1.192/26\n# VLSM 100+50+10 : /25 + /26 + /28","p":["Apprendre table /24-/30"],"w":"Oublier -2 (reseau+broadcast)."}]},{"id":"ccna2","t":"CCNA 2 VLAN trunk STP OSPF","f":[{"t":"VLAN trunk EtherChannel","r":"VLAN = broadcast domains. Access = 1 VLAN, trunk 802.1Q = plusieurs VLAN tagges. Native VLAN doit matcher. EtherChannel LACP : agregation 2-8 liens.","g":["Switch GUI ou CLI : creer VLAN, access, trunk"],"c":"vlan 10\nname COMPTA\ninterface fa0/1\nswitchport mode access\nswitchport access vlan 10\ninterface gi0/1\nswitchport mode trunk\nshow vlan brief","p":["Native identique des 2 cotes"],"w":"Port reste en VLAN 1."},{"t":"STP + OSPF + FHRP","r":"STP anti-boucle : root bridge, PVST par VLAN. show spanning-tree. OSPF : areas, router-id, DR/BDR en multi-acces, show ip ospf neighbor FULL. FHRP HSRP/VRRP : IP virtuelle passerelle.","g":["Packet Tracer : boucle + observer blocage STP","OSPF 2 routeurs area 0"],"c":"show spanning-tree\nrouter ospf 1\nnetwork 192.168.1.0 0.0.0.255 area 0\nshow ip ospf neighbor\nshow ip route ospf","p":["FULL = adjacence OK"],"w":"Mauvais wildcard = voisin KO."}]},{"id":"ccna3","t":"CCNA 3 NAT ACL DHCP secu auto","f":[{"t":"NAT ACL DHCP DNS NTP","r":"NAT statique 1:1, PAT overload N:1 via ports. ACL standard (source) et etendue (proto/IP/ports), implicite deny. DHCP 4 etapes DORA, snooping anti-rogue. DNS, NTP stratum.","g":["Routeur : NAT overload + ACL test ping","Wireshark DORA"],"c":"access-list 100 permit tcp 192.168.10.0 0.0.0.255 any eq 443\nip nat inside source list 100 interface g0/0 overload\nshow ip nat translations\nshow access-lists","p":["ACL pres du source si etendue"],"w":"Oublier deny implicite."},{"t":"Secu SSH VPN QoS SDN auto","r":"SSH + port-security + DHCP snooping + 802.1X. VPN IPsec site-a-site, GRE. QoS DSCP EF voix. SDN : controleur, NETCONF/RESTCONF, Python JSON. Toujours show + copy run start.","g":["Passer switch en SSH, desactiver telnet","Python : recuperer interfaces via REST"],"c":"show running-config\nshow ip int brief\nshow ip route\ncopy running-config startup-config","p":["Labs > theorie"],"w":"Telnet en clair = faute."}]}];const QCM=[{"q":"169.254.10.5 = ?","c":["IP publique","Echec DHCP, APIPA","DNS OK","VPN"],"a":1,"e":"APIPA = pas de DHCP."},{"q":"Ordre diag reseau ?","c":["DNS d'abord","Physique > IP > passerelle > DNS > Internet","Internet d'
